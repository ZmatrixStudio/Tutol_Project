<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <meta name="csrf-token" content="${csrf}"> -->
    <title>Đăng kí</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.google.com/recaptcha/api.js?render=6LdaoAwtAAAAAJGDRLJDtWFjA_KKWRdaY9KUXWEu"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-sha256/build/sha256.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style/style.css">

</head>

<body class="bg-[#f6f1f1] h-screen overflow-hidden flex items-center justify-center p-3">

    <!-- MAIN BOX -->
    <div class="w-full max-w-6xl h-full md:h-auto bg-white rounded-[30px] shadow-xl overflow-hidden flex flex-col md:flex-row animate-fade-in-up">

        <!-- LEFT IMAGE -->
        <div class="hidden md:flex md:w-1/2 bg-[#f3e5e5] items-center justify-center p-10">
            <img src="image/image_1.png" alt="login" class="w-[350px] opacity-90 transition-transform duration-700 hover:scale-105">
        </div>

        <!-- RIGHT LOGIN -->
        <div class="w-full md:w-1/2 px-7 py-5">

            <!-- MOBILE LOGO -->
            <img src="image/image_1.png" alt="logo" class="w-28 mx-auto opacity-50 md:hidden animate-fade-in-up">

            <!-- TITLE -->
            <div class="mt-2 animate-fade-in-up" style="animation-delay: 100ms">
                <h1 class="text-[#111] text-[28px] font-normal leading-[29px] font-['Itim']">
                    Đăng kí
                </h1>
                <div class="w-[80px] h-[3px] bg-[#9f9f9f] rounded-full mt-1"></div>
            </div>

           <!-- USERNAME -->
            <div class="mt-6 animate-fade-in-up" style="animation-delay: 200ms">
                <div class="group flex items-center border-2 border-[#c9b8b3] rounded-xl px-3 h-[52px] bg-white input-focus relative overflow-hidden">
                    <i class="fa-regular fa-user text-[#7d6d69] text-[20px] transition-all duration-300 group-focus-within:scale-110 group-focus-within:text-[#71f36f]"></i>
                    
                    <input 
                        id="username"
                        type="text" 
                        placeholder="Tên người dùng" 
                        class="w-full ml-3 outline-none text-[14px] text-[#6d5d59] bg-transparent peer">
                    
                    <!-- Bottom line animation -->
                    <div class="absolute bottom-0 left-0 h-[3px] w-0 bg-[#71f36f] transition-all duration-300 group-focus-within:w-full"></div>
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="mt-3 animate-fade-in-up" style="animation-delay: 300ms">
                <div id="password-wrapper" 
                    class="group relative flex items-center border-2 border-[#c9b8b3] rounded-xl px-3 h-[52px] bg-white input-focus overflow-hidden">
                    
                    <i class="fa-solid fa-shield-halved text-[#7d6d69] text-[20px] transition-all duration-300 group-focus-within:scale-110"></i>
                    
                    <input 
                        id="password"
                        type="password" 
                        placeholder="Mật khẩu" 
                        class="w-full ml-3 outline-none text-[14px] text-[#6d5d59] bg-transparent peer">
                    
                    <!-- Eye Icon -->
                    <button type="button" id="toggle-password"
                            class="text-[#8c7c78] hover:text-[#71f36f] transition-all duration-300 focus:outline-none">
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                    
                    <!-- Dynamic Underline -->
                    <div id="password-underline" 
                        class="absolute bottom-0 left-0 h-[3px] w-0 transition-all duration-300 bg-[#71f36f]">
                    </div>
                </div>

                <!-- Password Strength Meter -->
                <div id="password-strength" class="mt-2 px-1 hidden">
                    <div class="h-1.5 w-full bg-gray-200 rounded-full overflow-hidden">
                        <div id="strength-bar" 
                            class="h-full w-0 transition-all duration-300 rounded-full">
                        </div>
                    </div>
                    <p id="strength-text" class="text-xs mt-1 font-medium"></p>
                </div>
            </div>

            <!-- EMAIL -->
            <div class="mt-3 animate-fade-in-up" style="animation-delay: 200ms">
                <div class="group flex items-center border-2 border-[#c9b8b3] rounded-xl px-3 h-[52px] bg-white input-focus relative overflow-hidden">
                    <i class="fa-regular fa-envelope text-[#7d6d69] text-[20px] transition-all duration-300 group-focus-within:scale-110 group-focus-within:text-[#71f36f]"></i>                    
                    <input 
                        id="email"
                        type="text" 
                        placeholder="Nhập email" 
                        class="w-full ml-3 outline-none text-[14px] text-[#6d5d59] bg-transparent peer">
                    
                    <!-- Bottom line animation -->
                    <div class="absolute bottom-0 left-0 h-[3px] w-0 bg-[#71f36f] transition-all duration-300 group-focus-within:w-full"></div>
                </div>
            </div>

            <!-- FORGOT -->
            <div class="text-right mt-2 animate-fade-in-up" style="animation-delay: 400ms">
                <a href="forgot-password.html" class="text-[#ff5d73] text-[13px] font-semibold hover:underline">
                    Quên mật khẩu >
                </a>
            </div>

            <!-- BUTTON -->
            <button id="btnRegister" class="w-full h-[52px] rounded-xl bg-[#71f36f] mt-4 shadow-md btn-hover active:scale-95 duration-150 flex items-center justify-center animate-fade-in-up" style="animation-delay: 500ms">
                <span class="text-[#615757] text-[24px] font-normal leading-[29px] font-['Itim']" >
                    ĐĂNG KÍ
                </span>
            </button>

            <!-- LOGIN MESSAGE -->
           <div id="login-message"
                class="fixed top-5 right-5 px-4 py-3 rounded-xl text-sm font-semibold shadow-lg
                        transform translate-x-32 opacity-0 transition-all duration-500 z-50
                        backdrop-blur-md bg-white/20 border border-white/30">
            </div>

            <!-- LOGIN -->
            <div class="text-center mt-3 text-[13px] text-[#b2a4a0] animate-fade-in-up" style="animation-delay: 600ms">
                Bạn đã có tài khoản ?
                <a href="login.html" class="text-[#4f6fff] font-semibold hover:underline">
                    Đăng nhập >
                </a>
            </div>

            <hr>

            <!-- SOCIAL -->
            <div class="flex gap-3 mt-6 animate-fade-in-up" style="animation-delay: 700ms">
                <!-- GOOGLE -->
                <button id="google-custom-btn" type="button" class="flex-1 h-[42px] rounded-xl bg-[#f6dede] flex items-center justify-center gap-2 text-[13px] font-semibold text-[#745f5f] social-btn active:scale-95 duration-150">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19.4316 8.19808C19.5492 8.86681 19.6043 9.55023 19.6043 10.23C19.6043 13.2723 18.5167 15.8443 16.6245 17.586H16.6281C14.971 19.1145 12.6966 20 9.99967 20C6.21879 20 2.76125 17.8689 1.06372 14.4922C-0.354571 11.6666 -0.354573 8.33771 1.06371 5.51215C2.76125 2.13178 6.21879 0.000673866 9.99967 0.000673866C12.4835 -0.0287207 14.8828 0.904557 16.6906 2.60209L13.8357 5.45704C12.8032 4.47232 11.4253 3.93587 9.99967 3.95792C7.3909 3.95792 5.17528 5.71792 4.3853 8.08785C3.96643 9.32977 3.96643 10.6746 4.3853 11.9165H4.38898C5.18263 14.2828 7.39457 16.0428 10.0033 16.0428C11.3518 16.0428 12.5092 15.6974 13.4058 15.0874H13.4021C14.4566 14.3893 15.1768 13.2907 15.4009 12.0488H9.99966V8.19808H19.4316Z" fill="#A64A4A" />
                    </svg>
                    Google
                </button>

                <!-- FACEBOOK -->
                <button id="facebook-btn" class="flex-1 h-[42px] rounded-xl bg-[#f6e6b8] flex items-center justify-center gap-2 text-[13px] font-semibold text-[#745f5f] social-btn">
                    <svg width="25" height="25" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M25.0015 12.5769C25.0015 5.63086 19.4047 0 12.5007 0C5.59676 0 0 5.63086 0 12.5769C0 18.8544 4.57134 24.0575 10.5475 25.001V16.2124H7.37348V12.5769H10.5475V9.80604C10.5475 6.65396 12.4138 4.91285 15.2692 4.91285C16.6369 4.91285 18.0675 5.15849 18.0675 5.15849V8.25358H16.4912C14.9383 8.25358 14.454 9.22306 14.454 10.2177V12.5769H17.921L17.3667 16.2124H14.454V25.001C20.4301 24.0575 25.0015 18.8544 25.0015 12.5769Z" fill="#5C8BCA" />
                    </svg>
                    Facebook
                </button>
            </div>

            <!-- FOOTER -->
            <p class="text-center text-[12px] text-[#c2b5b5] mt-5 animate-fade-in-up" style="animation-delay: 900ms">
                Bản quyền thuộc về ZmatriXStudio
            </p>
        </div>
    </div>
    <div id="hidden-google-container" style="display: none !important;"></div>

    <script type="module" src="js/otp-verify.js"></script>
    <script src="js/email-validation.js"></script>
    <script src="js/password-toggle.js"></script>
    <script src="js/notification.js"></script>
    <script type="module" src="js/auth-google.js"></script>
    <script type="module" src="js/auth-facebook.js"></script>

    <script type="module">
        document.getElementById("btnRegister").addEventListener("click", register);

        import {headers} from "./js/get-headers.js";
        async function register() {
            const usernameInput = document.getElementById('username').value;
            const emailInput = document.getElementById('email').value;
            const password = passwordInput.value;

            if (!usernameInput) {
                showMessage("Vui lòng nhập tên người dùng");return;
            }
            if (!password){
                showMessage("Vui lòng nhập mặt khẩu");return;
            }
            if (!emailInput || !isValidEmail(emailInput)){
                showMessage ("Vui lòng nhập đúng Email");return;
            }
            if (!isPasswordStrong) {
                showMessage("Mật khẩu quá yếu !!");
                return; 
            }
            // Gửi lấy t-auth
            const token = await new Promise((resolve) => {
                    grecaptcha.ready(() => {
                        grecaptcha.execute('6LdaoAwtAAAAAJGDRLJDtWFjA_KKWRdaY9KUXWEu', {action: 'register'}).then(resolve);
                    });
                });
            
            //https://www.google.com/recaptcha/admin/site/755802202/setup?hl=vi
            showOTPModal(emailInput, null);

            const res = await fetch("http://localhost:8080/api/v1/auth/send-token", {
                method: "POST",
                headers:  await headers(),
                body: JSON.stringify({
                    "email": emailInput,
                    "username": usernameInput, 
                    "password": sha256(password),
                    "recaptchaToken": token,
                })
            }) 
            const data = await res.json();
            console.log("before");
            startOTPCountdown(data.time_token);
            console.log("after");
            // Trả về t-auth lấy cái đó để veri otp nếu ko có ko cho veri
            if (res.status === 200){
                localStorage.setItem("T-Auth", data.t_token);
                startOTPCountdown(data['time_token']);
            } else {
                showMessage(data.msg);
            }
        }
    </script>
    <script>
        const underline = document.getElementById("password-underline");
        const strengthBox = document.getElementById("password-strength");
        const strengthBar = document.getElementById("strength-bar");
        const strengthText = document.getElementById("strength-text");
        let isPasswordStrong = false; // Biến toàn cục để lưu trạng thái

        passwordInput.addEventListener("focus", () => {
            underline.style.width = "100%";
        });

        passwordInput.addEventListener("blur", () => {
            underline.style.width = "0%";
        });

        passwordInput.addEventListener("input", () => {
            const value = passwordInput.value;

            if (value.length === 0) {
                strengthBox.classList.add("hidden");
                return;
            }

            strengthBox.classList.remove("hidden");

            let score = 0;

            // điều kiện tăng điểm
            if (value.length >= 6) score++;
            if (value.length >= 10) score++;
            if (/[A-Z]/.test(value)) score++;
            if (/[0-9]/.test(value)) score++;
            if (/[^A-Za-z0-9]/.test(value)) score++;

            // map score -> UI
            let width = (score / 5) * 100;
            strengthBar.style.width = width + "%";

            if (score <= 2) {
                strengthBar.style.background = "red";
                strengthText.textContent = "Yếu";
                strengthText.style.color = "red";
                isPasswordStrong = false;
            } 
            else if (score <= 4) {
                strengthBar.style.background = "orange";
                strengthText.textContent = "Trung bình";
                strengthText.style.color = "orange";
                isPasswordStrong = false;
            } 
            else {
                strengthBar.style.background = "green";
                strengthText.textContent = "Mạnh";
                strengthText.style.color = "green";
                isPasswordStrong = true;
            }
        });
    </script>
</body>
</html>
